<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll Animation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #000;
        }

        #scroll-container {
            /* Make the body tall enough to scroll through all frames */
            height: 500vh;
        }

        #animation-canvas {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
        }
        
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: sans-serif;
            font-size: 24px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="loading" class="loading">Loading frames... 0%</div>
    <div id="scroll-container">
        <canvas id="animation-canvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('animation-canvas');
        const context = canvas.getContext('2d');
        const loadingElement = document.getElementById('loading');

        const frameCount = 231;
        const currentFrame = index => (
            `ezgif-frame-${(index + 1).toString().padStart(3, '0')}.jpg`
        );

        const images = [];
        let loadedImages = 0;
        
        // Preload images
        for (let i = 0; i < frameCount; i++) {
            const img = new Image();
            img.onload = () => {
                loadedImages++;
                loadingElement.innerText = `Loading frames... ${Math.round((loadedImages / frameCount) * 100)}%`;
                
                if (loadedImages === frameCount) {
                    loadingElement.style.display = 'none';
                    // Render first frame
                    renderFrame(0);
                }
            };
            img.src = currentFrame(i);
            images.push(img);
        }

        // Setup canvas size based on first image when it loads
        images[0].addEventListener('load', () => {
            canvas.width = images[0].naturalWidth;
            canvas.height = images[0].naturalHeight;
        });

        function renderFrame(index) {
            if (images[index] && images[index].complete) {
                // Clear the canvas
                context.clearRect(0, 0, canvas.width, canvas.height);
                // Draw the new image
                context.drawImage(images[index], 0, 0);
            }
        }

        window.addEventListener('scroll', () => {
            const scrollTop = document.documentElement.scrollTop;
            const maxScrollTop = document.documentElement.scrollHeight - window.innerHeight;
            const scrollFraction = scrollTop / maxScrollTop;
            const frameIndex = Math.min(
                frameCount - 1,
                Math.ceil(scrollFraction * frameCount)
            );
            
            requestAnimationFrame(() => renderFrame(frameIndex));
        });
        
        // Handle window resize to keep canvas centered
        window.addEventListener('resize', () => {
            // Can add logic here if needed, but CSS handles centering
        });
    </script>
</body>
</html>
